    <title>Ôn Thi Chứng Chỉ Đấu Thầu</title>
    
    <script>
      // Fix for extensions/browsers that try to set window.fetch when prototype has only a getter
      (function() {
        try {
          var nativeFetch = window.fetch;
          var activeFetch = typeof nativeFetch === 'function' ? function() {
            return nativeFetch.apply(window, arguments);
          } : nativeFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if defineProperty fails
        }

        // Suppress external browser extension errors from interrupting the applet
        window.addEventListener('error', function(event) {
          var isExtensionError = 
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && (event.message.indexOf('chrome-extension://') !== -1 || event.message.indexOf('moz-extension://') !== -1)) ||
            (event.error && event.error.stack && (event.error.stack.indexOf('chrome-extension://') !== -1 || event.error.stack.indexOf('moz-extension://') !== -1));

          if (isExtensionError) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
