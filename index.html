    <script>
      // Workaround for Brave Shields and extensions that hook fetch with a getter
      if (typeof window !== 'undefined') {
        const fetchDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (fetchDesc && fetchDesc.get && !fetchDesc.set) {
          Object.defineProperty(window, 'fetch', {
            get: fetchDesc.get,
            set: function(v) { /* Ignore */ },
            configurable: true
          });
        }
      }
    </script>
